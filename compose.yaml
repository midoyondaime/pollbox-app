# compose.yaml - the whole pollbox stack for LOCAL development (real deployment: Kubernetes, Helm, ArgoCD).
services:
  db:                                         # PostgreSQL: the source of truth
    image: postgres:16
    environment:
      POSTGRES_USER: pollbox                  # the container creates this user on first start
      POSTGRES_DB: pollbox                    # and this database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # read from .env, never written here
    ports: ["127.0.0.1:5432:5432"]            # published on the VM only
    volumes: ["pgdata:/var/lib/postgresql/data"]   # data survives container removal
    healthcheck:                              # lets other services wait until the database is ready
      test: ["CMD-SHELL", "pg_isready -U pollbox -d pollbox"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:                                      # the vote queue
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]            # published on the VM only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:                                        # FastAPI
    build: ./api                              # built from api/Dockerfile
    environment:                              # services reach each other by NAME on the Compose network
      DB_HOST: db
      POSTGRES_DB: pollbox
      POSTGRES_USER: pollbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
    ports: ["127.0.0.1:8000:8000"]            # for curl from the VM; the frontend does not need it
    depends_on:                               # start only when db and redis are healthy
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:                              # the python image has no curl, so use python itself
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  worker:                                     # takes votes from Redis, stores them in Postgres
    build: ./worker                           # no ports: nobody calls the worker
    environment:
      DB_HOST: db
      POSTGRES_DB: pollbox
      POSTGRES_USER: pollbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped                   # come back after a crash
  frontend:                                   # nginx: the page, and /api/ forwarded to the API
    build: ./frontend
    ports: ["8080:80"]                        # on all VM interfaces, so your host browser can reach it
    depends_on:
      api: {condition: service_healthy}       # nginx resolves the name "api" at startup, so wait for it
volumes:
  pgdata:                                     # the named volume holding the database files
