# ci.yml - CI for pollbox: test on every push and PR, build and push the images on push to main.
name: CI                                      # name shown in the Actions tab
on:                                           # the events that start the workflow
  push:
    branches: [main]                          # every push to main
  pull_request:                               # and every pull request
jobs:
  test:                                       # job 1: run the tests
    runs-on: ubuntu-latest                    # a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v6             # get the code
      - uses: actions/setup-python@v6         # install Python
        with:
          python-version: "3.12"              # same version as the images
      - run: pip install -r api/requirements.txt   # install the dependencies
      - run: pytest -q                        # run the tests
  build-push:                                 # job 2: build and push the images
    needs: test                               # the gate: only runs if test succeeded
    if: github.event_name == 'push'           # never on pull requests: PRs must not publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6             # get the code
      - uses: docker/login-action@v4          # log in to Docker Hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}   # stored as a repository secret
          password: ${{ secrets.DOCKERHUB_TOKEN }}      # stored as a repository secret
      - uses: docker/build-push-action@v6     # API image
        with:
          context: api                        # folder with the API Dockerfile
          push: true                          # push after building
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pollbox-api:github-${{ github.sha }}      # tag = commit SHA
      - uses: docker/build-push-action@v6     # worker image (the new step)
        with:
          context: worker                     # folder with the worker Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pollbox-worker:github-${{ github.sha }}   # same SHA, other repository
      - uses: docker/build-push-action@v6     # frontend image (new step)
        with:
          context: frontend                   # folder with the nginx Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pollbox-frontend:github-${{ github.sha }}   # same tag style as the others
