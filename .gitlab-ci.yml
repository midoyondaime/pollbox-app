# OVERVIEW
# GitLab CI pipeline for pollbox-app.
# One stage with one job: install the API dependencies and run the tests.
# The job requires the tag "vm-docker", so only my VM runner can take it
# (GitLab's shared runners don't have this tag).
# Later we add a build stage that builds and pushes the Docker image.

# The ordered list of stages. Jobs in a stage run only if the previous stage succeeded.
stages:
  # The only stage for now.
  - test

# A job named "test".
test:
  # Put this job in the "test" stage.
  stage: test
  # The container image the job runs in.
  image: python:3.12-slim
  # Only a runner carrying this tag may run the job.
  tags:
    # The tag we added to the VM runner on the website.
    - vm-docker
  # The commands to run, in order; the first one that fails makes the job red.
  script:
    # Install the same dependencies as locally.
    - pip install -r api/requirements.txt
    # Run the tests.
    - pytest -q
