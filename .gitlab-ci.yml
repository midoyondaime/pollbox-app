# .gitlab-ci.yml - GitLab CI for pollbox: test, then build and push the images (tags prefixed "gitlab-").
stages:                                       # the order in which stages run
  - test
  - build
test:                                         # job 1: run the tests
  stage: test
  image: python:3.12-slim                     # the container the job runs in
  tags: [vm-docker]                           # run on my own runner, not on GitLab's shared ones
  script:
    - pip install -r api/requirements.txt     # install the dependencies
    - pytest -q                               # run the tests
build:                                        # job 2: build and push the images
  stage: build                                # runs only if the test stage succeeded (the gate)
  image: docker:latest                        # the Docker client
  services:
    - docker:dind                             # a Docker daemon next to the job (Docker-in-Docker)
  tags: [vm-docker]                           # my runner
  variables:
    DOCKER_HOST: tcp://docker:2375            # the client talks to the dind service
    DOCKER_TLS_CERTDIR: ""                    # TLS off for dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"         # only on main
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin    # log in without putting the token on the command line
    - docker build -t "$DOCKERHUB_USERNAME/pollbox-api:gitlab-$CI_COMMIT_SHA" api         # API image, tag gitlab-<sha>
    - docker push "$DOCKERHUB_USERNAME/pollbox-api:gitlab-$CI_COMMIT_SHA"                  # push it
    - docker build -t "$DOCKERHUB_USERNAME/pollbox-worker:gitlab-$CI_COMMIT_SHA" worker   # worker image (new)
    - docker push "$DOCKERHUB_USERNAME/pollbox-worker:gitlab-$CI_COMMIT_SHA"               # push it
