# OVERVIEW
# GitLab CI pipeline for pollbox-app.
# Stage 1 "test": install the API dependencies and run pytest.
# Stage 2 "build": build the API Docker image and push it to Docker Hub,
# tagged with the commit SHA. It runs only if the test stage is green.
# Both jobs require the tag "vm-docker", so only my VM runner takes them.

# The ordered list of stages; a stage runs only if the previous one succeeded.
stages:
  # First: tests.
  - test
  # Second: build and push the image.
  - build

# Job "test".
test:
  # Belongs to the test stage.
  stage: test
  # Container the job runs in.
  image: python:3.12-slim
  # Only a runner with this tag may take the job.
  tags:
    - vm-docker
  # Commands, run in order.
  script:
    # Install the dependencies.
    - pip install -r api/requirements.txt
    # Run the tests.
    - pytest -q

# Job "build".
build:
  # Belongs to the build stage.
  stage: build
  # Container that provides the "docker" command (client only).
  image: docker:latest
  # A second container next to the job: the Docker engine (dind = Docker in Docker).
  services:
    - docker:dind
  # Only my VM runner may take the job.
  tags:
    - vm-docker
  # Variables for this job.
  variables:
    # Where the docker command finds the engine: the service named "docker".
    DOCKER_HOST: tcp://docker:2375
    # Turn TLS off between the two containers (they share a private network).
    DOCKER_TLS_CERTDIR: ""
  # Publish only for the main branch.
  rules:
    # Run when the branch is main.
    - if: $CI_COMMIT_BRANCH == "main"
  # Commands, run in order.
  script:
    # Log in to Docker Hub; the token is read from stdin so it never shows in the command line.
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    # Build the image from the api/ folder, tagged with the full commit SHA.
    - docker build -t "$DOCKERHUB_USERNAME/pollbox-api:$CI_COMMIT_SHA" api
    # Push the image to Docker Hub.
    - docker push "$DOCKERHUB_USERNAME/pollbox-api:$CI_COMMIT_SHA"
