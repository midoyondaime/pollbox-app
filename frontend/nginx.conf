# nginx.conf - serves the pollbox page and forwards /api/ to the API.
server {
    listen 80;                                  # listen on port 80 inside the container
    root /usr/share/nginx/html;                 # the folder holding the static files
    index index.html;                           # the default file for "/"

    location / {                                # everything that is not /api/: the static page
        try_files $uri /index.html;             # serve the file if it exists, otherwise the page
    }

    location /api/ {                            # every request whose path starts with /api/
        proxy_pass http://api:8000/;            # forward to the API; the final "/" removes the "/api" prefix
        proxy_set_header Host $host;            # keep the original Host header
        proxy_set_header X-Real-IP $remote_addr;   # pass the client's address to the API
    }
}
